<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      font-family: Arial, sans-serif;
      width: 220px;
      padding: 16px;
      margin: 0;
    }
    h2 {
      font-size: 14px;
      margin: 0 0 12px 0;
      color: #333;
    }
    .toggle-rad {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .toggle-label {
      font-size: 13px;
      color: #444;
    }
    /* Pill-toggle */
    .pill {
      position: relative;
      width: 40px;
      height: 22px;
      flex-shrink: 0;
    }
    .pill input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .pill-spor {
      position: absolute;
      inset: 0;
      background: #ccc;
      border-radius: 22px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .pill-spor::before {
      content: '';
      position: absolute;
      width: 16px;
      height: 16px;
      left: 3px;
      top: 3px;
      background: white;
      border-radius: 50%;
      transition: transform 0.2s;
    }
    .pill input:checked + .pill-spor {
      background: #0460a7;
    }
    .pill input:checked + .pill-spor::before {
      transform: translateX(18px);
    }
    button {
      width: 100%;
      padding: 10px;
      background: #0460a7;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
    }
    button:hover { background: #034d8a; }
    #status {
      margin-top: 10px;
      font-size: 12px;
      color: #555;
      min-height: 18px;
    }
    .ok { color: green; }
    .feil { color: red; }
  </style>
</head>
<body>
  <h2>Canvas – Vurdering med kommentar</h2>

  <div class="toggle-rad">
    <span class="toggle-label">Send kommentar</span>
    <label class="pill">
      <input type="checkbox" id="toggleKommentar" checked>
      <span class="pill-spor"></span>
    </label>
  </div>

  <button id="kjor">Godkjenn innlevering</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
